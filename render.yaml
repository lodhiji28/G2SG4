# Optional path B: one small container instead of Cloudflare Workers.
# Free instance type spins down after ~15 min idle (first request then takes a
# few seconds). Use this only if you would rather own a Postgres connection
# string than a D1 binding.
services:
  - type: web
    name: rank-mitra
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: EXAM_ID
        value: mpesb-g2sg4-2026
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: rank-mitra-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: EMAIL_PROVIDER
        value: console
databases:
  - name: rank-mitra-db
    databaseName: rankmitra
    plan: free
    ipAllowList: []
